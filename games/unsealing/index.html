<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0907">
<meta name="description" content="The Unsealing. Five things are hidden in the house. Something sleeps beneath it. Every one you take wakes it further.">
<title>The Unsealing</title>
<style>
  :root { --bg:#0b0907; --paper:#e6dcc8; --ink:#1a1410; --text:#d9cfbb; --muted:#8d8170; --accent:#b9863a; --danger:#8e3a2e; --panel:#151109; --line:#3a2f22; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif; }
  body { transition: filter 2.5s ease; }
  #app { position:absolute; inset:0; display:flex; flex-direction:column; max-width:520px; margin:0 auto; }
  #top { flex:0 0 auto; padding:6px 10px 2px; }
  #seis { display:block; width:100%; height:38px; background:#070503; border:1px solid var(--line); border-radius:3px; }
  #seisCap { font-size:11px; color:var(--muted); text-align:center; letter-spacing:.06em; margin:3px 0 4px; min-height:14px; }
  #stats { display:flex; justify-content:space-between; align-items:center; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  #stats .slots { display:flex; gap:5px; align-items:center; }
  #stats .slot { width:14px; height:14px; border:1px solid var(--muted); border-radius:2px; opacity:.55; }
  #stats .slot.on { background:var(--accent); border-color:var(--accent); opacity:1; }
  #stats .ward { width:12px; height:12px; border:1.5px solid var(--paper); border-radius:50%; margin-left:3px; }
  #mapWrap { flex:1 1 auto; min-height:0; position:relative; }
  #map { display:block; width:100%; height:100%; }
  #panel { flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line); padding:8px 12px calc(10px + env(safe-area-inset-bottom)); }
  #roomName { margin:0; font-size:19px; font-weight:normal; letter-spacing:.04em; color:var(--paper); }
  #flavor { margin:3px 0 6px; font-size:13px; line-height:1.35; color:var(--text); font-style:italic; min-height:34px; }
  #log { font-size:12.5px; line-height:1.35; color:var(--muted); min-height:34px; max-height:70px; overflow:hidden; }
  #log .new { color:var(--text); }
  #actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  button { font-family:inherit; font-size:14px; letter-spacing:.05em; padding:10px 8px; background:#221a12; color:var(--paper); border:1px solid var(--line); border-radius:3px; cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  button.primary { background:#3a2c18; border-color:var(--accent); }
  button.wide { grid-column: 1 / -1; }
  button small { display:block; font-size:10.5px; color:var(--muted); letter-spacing:.04em; margin-top:2px; }
  #modal { position:absolute; inset:0; background:rgba(4,3,2,.78); display:flex; align-items:center; justify-content:center; padding:18px; z-index:10; }
  #modal[hidden] { display:none; }
  .card { width:100%; max-width:420px; max-height:88%; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:18px 18px 14px; box-shadow:0 20px 60px rgba(0,0,0,.7); }
  .card h1 { margin:0 0 8px; font-size:24px; font-weight:normal; letter-spacing:.06em; color:var(--paper); }
  .card h1.title { font-size:34px; text-align:center; letter-spacing:.18em; margin:6px 0 14px; }
  .card p { margin:0 0 10px; font-size:14.5px; line-height:1.45; }
  .card .muted { color:var(--muted); font-size:13px; }
  .card .paper { background:var(--paper); color:var(--ink); padding:14px 16px; border-radius:2px; font-size:15px; line-height:1.5; box-shadow:inset 0 0 40px rgba(120,90,40,.25); margin:8px 0 12px; white-space:pre-wrap; }
  .card .paper.t3 { letter-spacing:.04em; } .card .paper.t4 { letter-spacing:.09em; line-height:1.7; } .card .paper.t5 { letter-spacing:.16em; line-height:2; }
  .card ol { margin:6px 0 12px; padding-left:22px; font-size:14px; line-height:1.5; }
  .card .row { display:flex; gap:8px; margin-top:10px; }
  .card .row button { flex:1; }
  .card .stat { display:flex; justify-content:space-between; font-size:14px; padding:4px 0; border-bottom:1px dashed var(--line); }
  #placeHint { position:absolute; left:0; right:0; top:8px; text-align:center; font-size:13px; letter-spacing:.08em; color:var(--paper); text-shadow:0 0 8px #000; pointer-events:none; }
  #placeHint[hidden] { display:none; }
</style>
</head>

             lib: 'Pressed between the pages of the register, a paper ward, cut in one piece from a single sheet.',
             stu: 'Drawn on the blotter in the shaking hand from the ledger: a circle, closed. Closed carefully.',
             land: 'Burned into the boards beneath the window, a mark in the shape of a shut eye.',
             nur: 'Stitched into the cot blanket, a border that goes all the way round. Someone knew what they were doing.',
             mas: 'Under the pillow, a bundle of hair tied nine times. It smells of lavender and of the well.',

// ============================================================================
// ===== ENGINE — pure rules, no DOM. Deterministic. ==========================
// ============================================================================
function createEngine(T, C, house) {
  house = house || defaultHouse(T);
  const rooms = {}; house.rooms.forEach(r => { rooms[r.id] = Object.assign({ adj: [] }, r); });
  house.doors.forEach(([a, b]) => { rooms[a].adj.push(b); rooms[b].adj.push(a); });
  const order = house.rooms.map(r => r.id);
  const itemRoom = {}; house.rooms.forEach(r => { if (r.kind === 'component') itemRoom[r.item] = r.id; });
  const DIST = {}, NEXT = {};
  for (const s of order) { // BFS from every room; deterministic parent choice by room order
    const d = { [s]: 0 }, parent = {}, q = [s];
    while (q.length) { const u = q.shift(); for (const v of order.filter(x => rooms[u].adj.includes(x))) if (!(v in d)) { d[v] = d[u] + 1; parent[v] = u; q.push(v); } }
    DIST[s] = d; NEXT[s] = parent;
  }
  const dist = (a, b) => DIST[a][b];
  function path(a, b) { // shortest path a -> b, excluding a, including b
    const p = []; let cur = b; while (cur !== a) { p.push(cur); cur = NEXT[a][cur]; } return p.reverse();
  }
  const S = {
    turn: 0, k: T.K_START, taken: [], wards: T.WARDS_START, player: house.start, threat: house.threatStart,
    awake: !T.THREAT_SLEEPS_UNTIL_FIRST_SEARCH, searched: {}, revealed: {}, removed: {}, visited: { [house.start]: 1 },
    phase: 'play', lastKnown: { room: house.threatStart, turn: 0 }, heard: false, listenPath: null, tier: 0, deathAt: null, notes: 0,
  };
  const tier = () => Math.min(5, S.taken.length);
  function updateHearing(ev) {
    const d = dist(S.threat, S.player); S.heard = d <= T.HEARING_RADIUS;
    if (S.heard) { S.lastKnown = { room: S.threat, turn: S.turn }; ev.push({ type: 'heard', room: S.threat, d, toward: d > 0 ? path(S.threat, S.player)[0] : null }); }
  }
  function encounter(ev) {
    S.threat = S.player;
    if (S.wards > 0) { S.wards--; S.phase = 'placement'; ev.push({ type: 'encounter', ward: true }); }
    else { S.phase = 'dead'; S.deathAt = S.player; ev.push({ type: 'death' }); }
  }
  function advance(steps, ev) {
    if (!S.awake) { S.awake = true; ev.push({ type: 'wakes' }); }
    const from = S.threat, p = path(S.threat, S.player), walked = [];
    for (let i = 0; i < steps && i < p.length; i++) {
      S.threat = p[i]; walked.push(p[i]);
      if (S.threat === S.player) { ev.push({ type: 'threatMoved', from, to: S.threat, walked, steps }); encounter(ev); return; }
    }
    ev.push({ type: 'threatMoved', from, to: S.threat, walked, steps });
  }
  function placementTargets() {
    let t = order.filter(r => !S.searched[r] && r !== S.player);

      case 'took': AUDIO.reward(); pushLog(C.items[e.item].take + ' ' + C.take.reward[e.n - 1]); setTier(e.tier); AUDIO.setTier(e.tier); SEIS.spike += 0.5; if (e.n >= TUNING.COMPONENTS_NEEDED && TUNING.ENDGAME_STALK > 0) pushLog(C.endgame.begins); break;
      case 'stalks': SEIS.spike += 0.2; break;
      case 'tookWard': AUDIO.chalk(); pushLog(C.take.ward); break;
      case 'wakes': pushLog(C.search.wakes); AUDIO.breath(); break;
      case 'threatMoved': SEIS.spike += 0.25 + 0.15 * e.walked.length; if (e.walked.length) { const d = g.dist(e.to, g.S.player); if (d > TUNING.HEARING_RADIUS) AUDIO.distant(panOf(e.to), Math.min(1, e.walked.length / 4)); }
        pushLog(g.S.taken.length >= TUNING.COMPONENTS_NEEDED ? C.endgame.stalks : C.search.stirs[Math.min(5, g.S.taken.length)]); break;
      case 'heard': if (e.d <= 1) { pushLog(C.hearing.d1); AUDIO.near(panOf(e.room)); } else { pushLog(fmt(C.hearing.d2, { room: C.rooms[e.toward].name })); AUDIO.distant(panOf(e.room), 1); } break;
      case 'listen': ui.showThreat = true; ui.showPath = true; AUDIO.breath(); setTimeout(() => AUDIO.distant(panOf(e.room), Math.min(1, 3 / Math.max(1, e.d))), 700);
        pushLog(e.d <= TUNING.HEARING_RADIUS ? C.hearing.listenNear : fmt(C.hearing.listenFar, { room: C.rooms[e.room].name })); break;
      case 'encounter': AUDIO.shatter(); queue.push(() => showModal({ title: C.encounter.withWard.title, html: `<p>${esc(C.encounter.withWard.body)}</p>`, buttons: [{ label: C.encounter.withWard.button, primary: true, fn: hideModal }] })); break;
      case 'placed': pushLog(fmt(C.encounter.placed, { room: C.rooms[e.room].name })); AUDIO.distant(panOf(e.room), 1); break;
      case 'death': AUDIO.death(); queue.push(showDeath); break;
      case 'won': AUDIO.win(); queue.push(showWin); break;
    }
  }
  refresh();
  let i = 0; const next = () => { if (i < queue.length) { const f = queue[i++]; f(); modalThen = next; } else modalThen = null; }; next();
}
let modalThen = null;
function showModal(o) {
  const card = $('card'); card.innerHTML = (o.title ? `<h1 class="${o.titleClass || ''}">${esc(o.title)}</h1>` : '') + (o.html || '') + '<div class="row"></div>';
  const row = card.querySelector('.row'); for (const b of o.buttons) { const el = document.createElement('button'); el.textContent = b.label; if (b.primary) el.classList.add('primary'); el.onclick = () => { AUDIO.init(); AUDIO.resume(); b.fn(); }; row.appendChild(el); }
  $('modal').hidden = false;
}
function hideModal() { $('modal').hidden = true; const f = modalThen; modalThen = null; if (f) f(); }
function showDeath() {
  const S = g.S, n = S.taken.length;
  const acts = n ? '<ol>' + S.taken.map(it => `<li>${esc(fmt(C.encounter.death.acts, { item: C.items[it].name, room: C.rooms[g.itemRoom[it]].name }))}</li>`).join('') + '</ol>' : `<p>${esc(C.encounter.death.none)}</p>`;
  showModal({ title: C.encounter.death.title, html: `<p>${esc(fmt(C.encounter.death.body, { n, s: n === 1 ? '' : 's' }))}</p>${acts}<p class="muted">${esc(fmt(C.encounter.death.stats, { turn: S.turn, c: n }))}</p>`,
    buttons: [{ label: C.encounter.death.again, primary: true, fn: () => { hideModal(); if (AUDIO.master) AUDIO.master.gain.setTargetAtTime(0.9, AUDIO.now(), 0.5); newGame(); } }] });
}
function showWin() {
  const S = g.S; let best = ui.best; if (!best || S.turn < best) { best = S.turn; ui.best = best; try { localStorage.setItem('unsealing.best', String(best)); } catch (e) {} }
  const share = fmt(C.win.share, { turns: S.turn, wards: S.wards, s: S.wards === 1 ? '' : 's', house: g.house.seed });
  showModal({ title: C.win.title, html: `<p>${esc(C.win.body)}</p><div class="stat"><span>${esc(C.win.turns)}</span><span>${S.turn}</span></div><div class="stat"><span>${esc(C.win.wards)}</span><span>${S.wards}</span></div><div class="stat"><span>${esc(C.win.best)}</span><span>${best}</span></div><p class="muted" style="margin-top:10px">${esc(share)}</p>`,
    buttons: [{ label: C.win.copy, fn: function () { try { navigator.clipboard.writeText(share); } catch (e) {} const b = $('card').querySelector('.row button'); if (b) b.textContent = C.win.copied; } }, { label: C.win.again, primary: true, fn: () => { hideModal(); if (AUDIO.master) AUDIO.master.gain.setTargetAtTime(0.9, AUDIO.now(), 0.5); newGame(); } }] });
}
function showTitle() {
  showModal({ title: C.title, titleClass: 'title', html: `<p class="muted" style="text-align:center">${esc(C.tagline)}</p>` + C.intro.map(p => `<p>${esc(p)}</p>`).join('') + (ui.best ? `<p class="muted">${esc(C.win.best)}: ${ui.best}</p>` : ''),
    buttons: [{ label: C.begin, primary: true, fn: () => { AUDIO.init(); AUDIO.resume(); hideModal(); newGame(); } }] });
}

// input
$('map').addEventListener('click', e => {
  if (!g || !$('modal').hidden) return; const r = $('map').getBoundingClientRect(); const id = RENDER.roomAt(e.clientX - r.left, e.clientY - r.top); if (!id) return; AUDIO.resume();
  if (g.S.phase === 'placement') { if (g.legal().place.includes(id)) doAct({ type: 'place', room: id }); return; }
  if (g.S.phase === 'play') tryMove(id);
});
window.addEventListener('keydown', e => { if (!g || !$('modal').hidden) { if (e.key === 'Enter' || e.key === ' ') { const b = $('card') && $('card').querySelector('button.primary'); if (b && !$('modal').hidden) { e.preventDefault(); b.click(); } } return; }
  const L = g.legal(); if (e.key === 's' && L.search) doAct({ type: 'search' }); else if (e.key === 'l' && L.listen) doAct({ type: 'listen' }); else if (e.key === 't' && L.take) confirmTake(L); else if (e.key === 'e' && L.enact) doAct({ type: 'enact' }); });
window.addEventListener('resize', () => { RENDER.resize(); SEIS.resize(); });
if (window.ResizeObserver) new ResizeObserver(() => RENDER.resize()).observe($('mapWrap'));
window.addEventListener('contextmenu', e => e.preventDefault());

// boot
window.__unsealing = { get g() { return g; }, act: a => doAct(a), tryMove, setTier: t => { setTier(t, true); AUDIO.setTier(t); } };
RENDER.init($('map')); SEIS.init($('seis'));
g = createEngine(TUNING, C); g.S.phase = 'title'; refresh(); $('roomName').textContent = ''; $('flavor').textContent = ''; $('actions').innerHTML = '';
let seisAcc = 0, lastF = performance.now();
(function loop(now) { requestAnimationFrame(loop); const dt = now - lastF; lastF = now; seisAcc += dt; while (seisAcc > 40) { SEIS.tick(); seisAcc -= 40; } RENDER.draw(g, ui); SEIS.draw(RENDER.pal); })(performance.now());
showTitle();
})();
</script>
</body>
