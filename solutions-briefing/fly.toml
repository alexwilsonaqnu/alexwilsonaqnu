# Production. Staging is fly.staging.toml (same image, APP_ENV=staging, always dry-run).
# Fly app names are global — if `solbrief` is taken, change it here and in .github/workflows/deploy.yml.
app = "solbrief"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  DRY_RUN = "true"            # flip to "false" at Milestone 7, by explicit decision
  SCHEDULE_TIMEZONE = "America/Chicago"
  DAILY_RUN_TIME = "04:30"
  RUN_DEADLINE = "06:30"

[deploy]
  # Runs in a temporary machine with the new image, secrets and network, before machines are updated.
  # A failed migration aborts the deploy.
  release_command = "alembic upgrade head"
  release_command_timeout = "10m"
  strategy = "rolling"

[processes]
  web = "uvicorn solbrief.web.app:app --host 0.0.0.0 --port 8080 --proxy-headers"
  worker = "python -m solbrief.worker"
  scheduler = "python -m solbrief.scheduler"   # keep at exactly 1 machine

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1    # inbound-email webhooks must not cold-start into a timeout

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# worker and scheduler expose no service, so Fly Proxy never auto-stops them.
[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "2gb"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["scheduler"]
  size = "shared-cpu-1x"
  memory = "256mb"
