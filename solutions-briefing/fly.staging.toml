# Staging: same image as production, its own app + its own Managed Postgres cluster.
# The daily run is ALWAYS a dry run here: APP_ENV=staging forces it in code (config.effective_dry_run),
# and the database refuses to mark a dry-run briefing as sent (CHECK dry_run_never_sent).
app = "solbrief-staging"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"
  DRY_RUN = "true"
  SCHEDULE_TIMEZONE = "America/Chicago"
  DAILY_RUN_TIME = "04:30"
  RUN_DEADLINE = "06:30"

[deploy]
  release_command = "alembic upgrade head"
  release_command_timeout = "10m"
  strategy = "rolling"

[processes]
  web = "uvicorn solbrief.web.app:app --host 0.0.0.0 --port 8080 --proxy-headers"
  worker = "python -m solbrief.worker"
  scheduler = "python -m solbrief.scheduler"

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "2gb"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["scheduler"]
  size = "shared-cpu-1x"
  memory = "256mb"
