# Verifier trap set. Every support marked `expect: fail` is a deliberately unsupported claim; the verifier
# must reject 100% of them (CI hard gate). Supports marked `expect: ok` are genuine quotations from the
# recorded sources and must pass (false-rejection guard).
#
# Sources are real pages recorded in sources/ (index.json maps URL → text). Spans for `ok` supports are
# copied verbatim from those pages.

urls:
  hf: &hf https://thecommunityguide.cdc.gov/findings/social-determinants-health-housing-first-programs.html
  su: &su https://thecommunityguide.cdc.gov/findings/Substance-Use-Digital-Interventions-to-Prevent-Substance-Use-among-Adolescents.html
  il: &il https://thecommunityguide.cdc.gov/findings/motor-vehicle-injury-alcohol-impaired-driving-ignition-interlocks.html
  pm: &pm https://pubmed.ncbi.nlm.nih.gov/22652205/
  dead: &dead https://thecommunityguide.cdc.gov/findings/retired-finding-that-no-longer-exists.html
  cochrane: &cochrane https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD000000/full

# The genuine Housing First card every case starts from (two publishers: CDC and NIH).
base:
  title: Housing First programs
  response_what: >-
    Housing First programs give people experiencing homelessness who have a disabling condition subsidized,
    time-unlimited housing without first requiring sobriety or treatment.
  insight_mechanism: >-
    Housing comes first: services are offered but not required, which reverses the theory behind
    treatment-first programs.
  insight_transferability: Evidence comes mostly from urban and suburban programs.
  supports:
    - id: response
      pillar: response
      url: *hf
      claim: Housing First programs provide subsidized, time-unlimited housing to people experiencing homelessness.
      span: >-
        Housing First programs provide regular, subsidized, time-unlimited housing to individuals and families
        experiencing homelessness in which the head of household has a disabling condition
      expect: ok
    - id: insight_cdc
      pillar: insight
      url: *hf
      claim: Clients do not have to be substance free or in treatment to take part.
      span: Clients are not required to be “housing ready,” (i.e., substance free or in treatment) to participate in a program.
      expect: ok
    - id: insight_nih
      pillar: insight
      url: *pm
      claim: The Housing First model rests on a theory of housing that contradicts the dominant model.
      span: >-
        The 'Housing First' model of supportive housing for people with severe mental illness is based on a theory
        of the role of housing in living with mental illness that has a number of elements that directly
        contradict the theory underlying the dominant model.
      expect: ok
    - id: stability
      pillar: evidence
      url: *hf
      source_type: systematic_review
      claim: Clients in Housing First programs had a median 41% greater housing stability (13 studies).
      span: "clients in Housing First programs experienced the following: - Median 41% greater housing stability (13 studies)"
      expect: ok
  limitations:
    - id: rural
      url: *hf
      limitation: No included study took place in a rural setting.
      span: None of the included studies were conducted in rural settings.
      expect: ok
  experts: []
  expect_card: {status: verified, publishable: true, grade: meta_analysis_or_rct}

cases:
  - name: genuine_card_verifies
    changes: {}

  - name: fabricated_span
    add_supports:
      - id: trap
        pillar: evidence
        url: *hf
        source_type: systematic_review
        claim: "Housing First programs cut overdose deaths in half."
        span: "Housing First programs reduced overdose deaths by half among participants in all included studies."
        expect: fail
        reasons: [span_not_found]

  - name: altered_number_in_span
    add_supports:
      - id: trap
        pillar: evidence
        url: *hf
        source_type: systematic_review
        claim: "Clients had a median 14% greater housing stability (13 studies)."
        span: "clients in Housing First programs experienced the following: - Median 14% greater housing stability (13 studies)"
        expect: fail
        reasons: [span_number_mismatch, span_not_found]

  - name: claim_adds_statistic_not_in_span
    add_supports:
      - id: trap
        pillar: evidence
        url: *hf
        source_type: systematic_review
        claim: "Housing First programs reduced homelessness by 88% and cut public costs by 50%."
        span: "Median 88% greater decrease in homelessness (5 studies) - Median 5% greater improvement in quality of life (4 studies)"
        expect: fail
        reasons: [claim_numbers_not_in_span]

  - name: span_from_a_different_page
    add_supports:
      - id: trap
        pillar: evidence
        url: *hf
        source_type: systematic_review
        claim: "Digital interventions reduced binge drinking among adolescents."
        span: >-
          The Community Preventive Services Task Force (CPSTF) recommends digital interventions for substance use
          prevention based on sufficient evidence of effectiveness
        expect: fail
        reasons: [span_not_found]

  - name: dead_link
    add_supports:
      - id: trap
        pillar: evidence
        url: *dead
        source_type: systematic_review
        claim: "Clients had a median 41% greater housing stability (13 studies)."
        span: "clients in Housing First programs experienced the following: - Median 41% greater housing stability (13 studies)"
        expect: fail
        reasons: [source_unreachable]

  - name: span_too_short_to_mean_anything
    add_supports:
      - id: trap
        pillar: evidence
        url: *hf
        source_type: systematic_review
        claim: "The review included 26 studies."
        span: "26 studies"
        expect: fail
        reasons: [span_too_short]

  - name: paraphrase_presented_as_quote
    add_supports:
      - id: trap
        pillar: evidence
        url: *hf
        source_type: systematic_review
        claim: "Participants had much more housing stability than comparison groups."
        span: "Housing First participants were much more stably housed than people in the comparison groups were."
        expect: fail
        reasons: [span_not_found]

  - name: blocked_source_cochrane
    add_supports:
      - id: trap
        pillar: evidence
        url: *cochrane
        source_type: systematic_review
        claim: "A Cochrane review supports Housing First."
        span: "This review found that Housing First interventions improve housing stability for adults."
        expect: fail
        reasons: [blocked_source]

  - name: negation_flipped_positive
    add_supports:
      - id: trap
        pillar: evidence
        url: *hf
        source_type: systematic_review
        claim: "Housing First programs improved physical health, mental health, and substance abuse outcomes."
        span: "There were no apparent differences in physical health, mental health, or substance abuse between the intervention and control groups."
        expect: fail
        reasons: [negation_mismatch]

  - name: negation_added
    add_supports:
      - id: trap
        pillar: evidence
        url: *hf
        source_type: systematic_review
        claim: "Housing First programs did not improve housing stability."
        span: "clients in Housing First programs experienced the following: - Median 41% greater housing stability (13 studies)"
        expect: fail
        reasons: [negation_mismatch]

  - name: limitation_without_quote
    add_limitations:
      - id: trap
        url: *hf
        limitation: "Programs are too expensive for most cities."
        span: null
        expect: fail
        reasons: [no_support_span]

  - name: fabricated_limitation
    add_limitations:
      - id: trap
        url: *hf
        limitation: "Programs failed in every rural trial."
        span: "Housing First programs failed in every rural trial that the review team examined."
        expect: fail
        reasons: [span_not_found]

  # Card-level traps: the card must not verify / publish.
  - name: only_evidence_is_fabricated
    replace_supports:
      stability:
        id: trap
        pillar: evidence
        url: *hf
        source_type: systematic_review
        claim: "Housing First programs ended homelessness for 90% of participants."
        span: "Housing First programs ended homelessness for 90% of participants in the included studies."
        expect: fail
        reasons: [span_not_found]
    expect_card: {status: provisional, publishable: false}

  - name: unsupported_number_in_card_prose
    changes:
      response_what: "Housing First programs have housed 500,000 people with disabling conditions."
    expect_card: {status: provisional, publishable: false, reason: "pillar_unsupported:response"}

  - name: missing_limitations_pillar
    remove_limitations: [rural]
    expect_card: {status: provisional, publishable: false, reason: "pillar_unsupported:limitations"}

  - name: single_publisher_stays_provisional
    remove_supports: [insight_nih]
    expect_card: {status: provisional, publishable: true, reason: fewer_than_two_independent_publishers}

  # Controls: genuine quotations from another recorded page must pass.
  - name: control_numbers_with_commas
    add_supports:
      - id: control
        pillar: evidence
        url: *su
        source_type: systematic_review
        claim: "Studies included a median of 1,234 participants."
        span: "Studies included a median of 1,234 participants (45 studies)."
        expect: ok
