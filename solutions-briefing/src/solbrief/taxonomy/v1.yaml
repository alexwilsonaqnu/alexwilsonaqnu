# Problem taxonomy v1 — FROZEN. Never edit ids in place.
# Changes go through taxonomy_changes (agents may only propose; humans accept) and a new vN.yaml + migration.
# Our own classes; an `external_tag` mapping to SJN Story Tracker issue areas is added only once SJN grants
# permission (see docs/PLAN.md §1.2).
version: v1
