<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Solutions Briefing{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Solutions Briefing</a>
    <span class="tag">Documented responses to the problems you cover</span>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer class="site">
    A Knight Lab project (Northwestern Medill). Every claim links to the source passage it comes from.
    Need an expert fast? <a href="{{ SCILINE }}">SciLine's free expert matching for reporters</a>.
  </footer>
</body>
</html>
