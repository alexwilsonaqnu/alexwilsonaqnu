name: Deploy

# Merge to main → deploy staging → smoke test → (production, once enabled).
# Production deploys only when the repository variable DEPLOY_PRODUCTION is "true" (set at Milestone 7)
# and pass through the "production" GitHub Environment (add required reviewers there if wanted).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy staging
        run: flyctl deploy --remote-only --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://solbrief-staging.fly.dev/healthz; then exit 0; fi
            sleep 6
          done
          exit 1

  production:
    needs: staging
    if: vars.DEPLOY_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy production
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://solbrief.fly.dev/healthz; then exit 0; fi
            sleep 6
          done
          exit 1
