<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldTech Assist — demo</title>
<style>
  :root {
    --bg: #10131a; --panel: #171b24; --line: #262c38; --ink: #e8ecf3;
    --dim: #8b93a5; --accent: #4f9cf9; --tech: #1f2735; --warn: #f0a33a;
    --safety: #3a1f1f; --safety-line: #a8442f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .meta { color: var(--dim); font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pill {
    font-size: 12px; padding: 2px 9px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .pill.on { color: #7ee0a5; border-color: #2c5a41; }
  .pill.off { color: var(--warn); border-color: #5a4526; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  #transcript { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 74%; padding: 11px 14px; border-radius: 13px; white-space: pre-wrap; }
  .msg.agent { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.tech { background: var(--tech); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.sys { align-self: center; max-width: 90%; background: none; color: var(--dim);
             font-size: 12.5px; text-align: center; padding: 2px; }
  .msg.safety { background: var(--safety); border-color: var(--safety-line); }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 4px; }

  aside { border-left: 1px solid var(--line); background: var(--panel);
          display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
             color: var(--dim); margin: 0; padding: 14px 16px 10px; }
  #figures { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  .figure { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .figure img { width: 100%; display: block; background: #fff; }
  .figure .cap { padding: 7px 10px; font-size: 11.5px; color: var(--dim);
                 font-family: ui-monospace, Menlo, monospace; border-top: 1px solid var(--line); }
  .empty { color: var(--dim); font-size: 13px; padding: 4px 0 18px; }

  .card { margin: 0 16px 16px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
             letter-spacing: .09em; color: var(--dim); font-weight: 600; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .card dt { color: var(--dim); }
  .card dd { margin: 0; font-family: ui-monospace, Menlo, monospace; }
  .card button {
    margin-top: 10px; width: 100%; background: none; color: var(--accent);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px; cursor: pointer; font-size: 12.5px;
  }
  .card button:hover { border-color: var(--accent); }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 14px 20px;
           display: flex; gap: 12px; align-items: center; }
  #ptt {
    flex: 0 0 auto; padding: 13px 22px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--tech); color: var(--ink); font-size: 14px; font-weight: 600;
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
    transition: background .12s, border-color .12s;
  }
  #ptt:hover:not(:disabled) { border-color: var(--accent); }
  #ptt.recording { background: #7a2230; border-color: #d0455c; }
  #ptt:disabled { opacity: .45; cursor: not-allowed; }
  #text { flex: 1; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--line);
          background: var(--bg); color: var(--ink); font: inherit; }
  #text:focus { outline: none; border-color: var(--accent); }
  #status { color: var(--dim); font-size: 12.5px; min-width: 120px; }
  .hint { color: var(--dim); font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <h1>FieldTech Assist</h1>
  <span class="meta" id="brain">connecting…</span>
  <span class="pill" id="voicePill">voice: …</span>
  <span class="meta" id="ctx"></span>
</header>

<main>
  <div id="transcript"></div>
  <aside>
    <div class="card" id="demoCard"><h3>Demo card</h3><dl id="demoList"></dl></div>
    <h2>Technician's app — pushed diagrams</h2>
    <div id="figures"><p class="empty">Nothing pushed yet. Ask to see a diagram and it lands here.</p></div>
  </aside>
</main>

<footer>
  <button id="ptt" disabled>Hold to talk</button>
  <input id="text" placeholder="…or type what the technician says, then press Enter" autocomplete="off">
  <span id="status"></span>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const transcript = $('transcript'), figures = $('figures');
let busy = false, seenFigures = new Set(), voiceReady = false;

function add(text, who, opts = {}) {
  const el = document.createElement('div');
  el.className = 'msg ' + who + (opts.safety ? ' safety' : '');
  if (who !== 'sys') {
    const w = document.createElement('div');
    w.className = 'who';
    w.textContent = who === 'agent' ? 'agent' : 'technician';
    el.appendChild(w);
  }
  el.appendChild(document.createTextNode(text));
  transcript.appendChild(el);
  transcript.scrollTop = transcript.scrollHeight;
  return el;
}

function addFigures(list) {
  if (!list || !list.length) return;
  for (const f of list) {
    if (seenFigures.has(f.figure_id)) continue;
    seenFigures.add(f.figure_id);
    const empty = figures.querySelector('.empty');
    if (empty) empty.remove();
    const wrap = document.createElement('div');
    wrap.className = 'figure';
    const img = document.createElement('img');
    img.src = '/api/figure?figure_id=' + encodeURIComponent(f.figure_id);
    img.alt = 'Figure ' + f.figure_id;
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = f.figure_id;
    wrap.append(img, cap);
    figures.prepend(wrap);
  }
}

function setBusy(on, label) {
  busy = on;
  $('status').textContent = label || '';
  $('text').disabled = on;
  $('ptt').disabled = on || !voiceReady;
}

// Quoted manual warnings get visual weight — they are the one thing that must not be
// skimmed past in a demo.
const isSafety = (t) => /the manual says, quote:/i.test(t) || /\b(WARNING|DANGER|CAUTION)\b/.test(t);

async function send(text) {
  if (busy || !text.trim()) return;
  add(text, 'tech');
  setBusy(true, 'thinking…');
  try {
    const r = await fetch('/api/text', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    const data = await r.json();
    if (data.error) { add('Error: ' + data.error, 'sys'); return; }
    add(data.reply, 'agent', {safety: isSafety(data.reply)});
    addFigures(data.figures);
    updateCtx(data);
  } catch (e) {
    add('Request failed: ' + e.message, 'sys');
  } finally { setBusy(false); }
}

function updateCtx(d) {
  const bits = [];
  if (d.model_number) bits.push('model ' + d.model_number);
  if (d.case_id) bits.push('case ' + d.case_id);
  $('ctx').textContent = bits.join(' · ');
}

$('text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = e.target.value; e.target.value = ''; send(v); }
});

// ---- push to talk ----------------------------------------------------------
let recorder = null, chunks = [], stream = null;

async function startRec() {
  if (busy || recorder) return;
  try {
    if (!stream) stream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (e) { add('Microphone blocked: ' + e.message, 'sys'); return; }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = sendAudio;
  recorder.start();
  $('ptt').classList.add('recording');
  $('ptt').textContent = 'Release to send';
  $('status').textContent = 'listening…';
}

function stopRec() {
  if (!recorder) return;
  recorder.stop();
  recorder = null;
  $('ptt').classList.remove('recording');
  $('ptt').textContent = 'Hold to talk';
}

async function sendAudio() {
  const blob = new Blob(chunks, {type: chunks[0]?.type || 'audio/webm'});
  if (blob.size < 1200) { $('status').textContent = ''; return; }  // stray click
  setBusy(true, 'transcribing…');
  try {
    const r = await fetch('/api/audio', {
      method: 'POST', headers: {'Content-Type': blob.type}, body: blob
    });
    const data = await r.json();
    if (data.error) { add('Error: ' + data.error, 'sys'); return; }
    if (!data.transcript) { add('(nothing heard)', 'sys'); return; }
    add(data.transcript, 'tech');
    add(data.reply, 'agent', {safety: isSafety(data.reply)});
    addFigures(data.figures);
    updateCtx(data);
    if (data.audio) new Audio('data:audio/wav;base64,' + data.audio).play();
    else if (data.tts_error) add('Speech playback failed: ' + data.tts_error, 'sys');
  } catch (e) {
    add('Request failed: ' + e.message, 'sys');
  } finally { setBusy(false); }
}

const ptt = $('ptt');
ptt.addEventListener('mousedown', startRec);
ptt.addEventListener('touchstart', (e) => { e.preventDefault(); startRec(); });
window.addEventListener('mouseup', stopRec);
window.addEventListener('touchend', stopRec);
// Hold space as well — a presenter's hands are usually on the keyboard.
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && document.activeElement !== $('text') && !e.repeat) { e.preventDefault(); startRec(); }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && document.activeElement !== $('text')) { e.preventDefault(); stopRec(); }
});

// ---- boot ------------------------------------------------------------------
(async () => {
  const s = await (await fetch('/api/state')).json();
  $('brain').textContent = s.provider + '/' + s.model + '  ·  session ' + s.session_id;
  voiceReady = s.voice_available;
  const pill = $('voicePill');
  pill.textContent = voiceReady ? 'voice: ready (hold Space)' : 'voice: text only';
  pill.className = 'pill ' + (voiceReady ? 'on' : 'off');
  if (!voiceReady) {
    pill.title = s.voice_error || '';
    $('ptt').textContent = 'Mic unavailable';
  }
  $('ptt').disabled = !voiceReady;

  const d = s.demo || {};
  const rows = [
    ['Technician', d.technician_id + (d.technician_name ? '  (' + d.technician_name + ')' : '')],
    ['Model', d.model_number], ['Serial', d.serial_number], ['Issue', d.issue],
    ['No-case tech', d.unknown_technician_id],
  ];
  const dl = $('demoList');
  for (const [k, v] of rows) {
    if (!v) continue;
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    dl.append(dt, dd);
  }
  const btn = document.createElement('button');
  btn.textContent = 'Start the call  →  "technician ' + d.technician_id + '"';
  btn.onclick = () => send('technician ' + d.technician_id);
  $('demoCard').appendChild(btn);

  addFigures(s.figures);   // rehydrate after a reload mid-call
  add(s.greeting, 'agent');
})();
</script>
</body>
</html>
